<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Touhid</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #08090c; color: #f5f6fa; text-align: center;
      }
      @media (prefers-color-scheme: light) { body { background: #f8f9fb; color: #0f1117; } }
      .code { font: 500 14px ui-monospace, SFMono-Regular, monospace; color: #7c8aff; letter-spacing: .12em; }
      h1 { margin: 12px 0 8px; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.02em; }
      p { margin: 0 0 28px; opacity: .7; }
      a {
        display: inline-block; padding: 12px 22px; border-radius: 999px; text-decoration: none; font-weight: 600;
        background: #7c8aff; color: #08090c;
      }
      a:focus-visible { outline: 2px solid #7c8aff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">ERROR 404</div>
      <h1>This page doesn't exist.</h1>
      <p>The link may be broken or the page may have moved.</p>
      <a href="/">Back to portfolio</a>
    </main>
  </body>
</html>
